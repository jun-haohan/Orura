services:

  mysql:
    image: mysql:8.4
    container_name: akp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: akp
    ports:
      - "13306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  mongodb:
    image: mongo:8
    container_name: akp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db

  redis:
    image: redis:7
    container_name: akp-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: akp-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "19200:9200"
      - "19300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: akp-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - NO_PROXY=localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
      - no_proxy=localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./data/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: akp-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
      no_proxy: localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./data/milvus/minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: akp-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
      no_proxy: localhost,127.0.0.1,0.0.0.0,::1,*.local,etcd,minio,milvus,akp-etcd,akp-minio,akp-milvus,172.18.0.0/16
    ports:
      - "19530:19530"
      - "19091:9091"
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
