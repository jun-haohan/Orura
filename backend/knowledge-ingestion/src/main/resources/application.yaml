server:
  port: 18400

spring:
  application:
    name: knowledge-ingestion

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mongodb:
    host: localhost
    port: 27017
    database: akp

milvus:
  uri: http://localhost:19530
  collection-name: knowledge_chunk_vector

embedding:
  base-url: http://localhost:19003
  model: BAAI/bge-m3
  dimension: 1024
  batch-size: 16

parser:
  service:
    url: http://localhost:19002